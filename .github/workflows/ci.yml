name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The bank-deployable path: green with no GPU, no native library and no
  # incubator flag. Default test run (the slow `mc` Monte-Carlo group excluded).
  clean-lts:
    name: Compile and package (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: maven

      - name: Build and test
        run: mvn -B -q -DskipTests clean verify

      - name: Install
        run: mvn -B -q install -DskipTests

  # The full suite: SIMD module enabled (jdk.incubator.vector) and the slow
  # closed-form-vs-Monte-Carlo validation group (`-P mc`) run as well.
  full:
    name: Compile examples (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: maven

      - name: Build (GPU validation runs on configured hardware)
        run: mvn -B -DskipTests clean verify

      - name: Install
        run: mvn -B -q install -DskipTests

      - name: Package finance examples
        run: >
          mvn -B -q -pl quant-examples -am -DskipTests verify
